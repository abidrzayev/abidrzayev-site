<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory planning – Abid Rzayev</title>
<meta name="description" content="Safety stock, reorder points and ABC/XYZ segmentation driven by real forecast errors; interactive service level, lead time and cost trade-offs.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Cpath d='M6 22l6-8 5 5 9-11' fill='none' stroke='%2338bdf8' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="inventory" data-root="../" data-title="inv.title">
<main id="main" class="container">

  <section class="hero">
    <div class="eyebrow" data-i18n="inv.eyebrow"></div>
    <h1 data-i18n="inv.h1"></h1>
    <p class="lead" data-i18n="inv.lead"></p>
    <div class="chips"><span class="chip real" data-i18n="inv.chip.real"></span><span class="chip model" data-i18n="inv.chip.model"></span></div>
  </section>

  <div id="sample-banner"></div>
  <div class="callout warn"><strong data-i18n="inv.scope.h"></strong> <span data-i18n="inv.scope.p"></span></div>

  <section id="controls">
    <div class="section-title"><h2 data-i18n="inv.ctl.h"></h2><span class="chip model" data-i18n="chip.model"></span></div>
    <div class="card">
      <div class="controls">
        <div class="ctl"><label for="s-csl"><span data-i18n="inv.ctl.csl"></span><output id="s-csl-out"></output></label>
          <input type="range" id="s-csl" min="80" max="99.9" step="0.1" value="95"><div class="hint" data-i18n="inv.ctl.csl.h"></div></div>
        <div class="ctl"><label for="s-L"><span data-i18n="inv.ctl.L"></span><output id="s-L-out"></output></label>
          <input type="range" id="s-L" min="1" max="14" step="1" value="4"><div class="hint" data-i18n="inv.ctl.L.h"></div></div>
        <div class="ctl"><label for="s-C"><span data-i18n="inv.ctl.C"></span><output id="s-C-out"></output></label>
          <input type="range" id="s-C" min="1" max="28" step="1" value="7"><div class="hint" data-i18n="inv.ctl.C.h"></div></div>
        <div class="ctl"><label for="s-h"><span data-i18n="inv.ctl.h"></span><output id="s-h-out"></output></label>
          <input type="range" id="s-h" min="5" max="40" step="1" value="20"><div class="hint" data-i18n="inv.ctl.h.h"></div></div>
        <div class="ctl"><label for="s-cr"><span data-i18n="inv.ctl.cr"></span><output id="s-cr-out"></output></label>
          <input type="range" id="s-cr" min="40" max="95" step="1" value="70"><div class="hint" data-i18n="inv.ctl.cr.h"></div></div>
        <div class="ctl"><label for="s-p"><span data-i18n="inv.ctl.p"></span><output id="s-p-out"></output></label>
          <input type="range" id="s-p" min="5" max="150" step="5" value="30"><div class="hint" data-i18n="inv.ctl.p.h"></div></div>
        <div class="ctl"><label for="scope" data-i18n="inv.ctl.scope"></label><select id="scope"></select></div>
      </div>
    </div>
  </section>

  <section id="results">
    <div class="section-title"><h2 data-i18n="inv.res.h"></h2><span class="muted" id="scope-label"></span></div>
    <div class="grid grid-4" id="inv-kpis"></div>
  </section>

  <section>
    <div class="grid grid-2">
      <div class="card"><h3 data-i18n="inv.c.cost"></h3>
        <div class="chart-box"><canvas id="ch-cost" role="img" aria-label="Annual cost versus service level"></canvas></div>
        <p class="muted" style="margin:10px 0 0;font-size:.88rem" data-i18n="inv.c.cost.note"></p></div>
      <div class="card"><h3 data-i18n="inv.c.class"></h3>
        <div class="chart-box"><canvas id="ch-class" role="img" aria-label="Safety stock by ABC and XYZ class"></canvas></div>
        <p class="muted" style="margin:10px 0 0;font-size:.88rem" data-i18n="inv.c.class.note"></p></div>
    </div>
  </section>

  <section id="segmentation">
    <div class="section-title"><h2 data-i18n="inv.seg.h"></h2><span class="chip real" data-i18n="chip.real"></span></div>
    <div class="grid grid-2">
      <div class="card"><div class="table-wrap"><table class="data matrix" id="tbl-matrix"></table></div>
        <p class="muted" style="margin:10px 0 0;font-size:.88rem" id="seg-note"></p></div>
      <div class="card"><h3 data-i18n="inv.diff.h"></h3>
        <p class="muted" data-i18n="inv.diff.p"></p>
        <label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" id="diff"> <span data-i18n="inv.diff.on"></span></label>
        <div class="controls" style="grid-template-columns:repeat(3,1fr)">
          <div class="ctl"><label for="pol-a">A %</label><input type="number" id="pol-a" min="50" max="99.9" step="0.5" value="98"></div>
          <div class="ctl"><label for="pol-b">B %</label><input type="number" id="pol-b" min="50" max="99.9" step="0.5" value="95"></div>
          <div class="ctl"><label for="pol-c">C %</label><input type="number" id="pol-c" min="50" max="99.9" step="0.5" value="90"></div>
        </div>
        <p id="diff-note" style="margin:12px 0 0"></p></div>
    </div>
  </section>

  <section id="stores">
    <div class="section-title"><h2 data-i18n="inv.st.h"></h2><span class="chip real" data-i18n="chip.real"></span></div>
    <div class="card"><div class="table-wrap"><table class="data" id="tbl-stores"></table></div></div>
  </section>

  <section id="method">
    <div class="section-title"><h2 data-i18n="inv.m.h"></h2></div>
    <div class="grid grid-2">
      <div class="card"><h3 data-i18n="inv.m.f.h"></h3>
        <p><span class="formula">σ_L = σ_e · √L</span></p>
        <p><span class="formula">SS = z · σ_L &nbsp;&nbsp; ROP = μ · L + SS</span></p>
        <p><span class="formula">fill rate = 1 − σ_L · G(z) / Q &nbsp;&nbsp; Q = μ · C</span></p>
        <p><span class="formula">cost = h·c·SS + p·(N/C)·σ_L·G(z)</span></p>
        <p><span class="formula">1 − Φ(z*) = h·c·C / (p·N)</span></p>
        <p class="muted" style="font-size:.88rem" data-i18n="inv.m.f.legend"></p></div>
      <div class="card"><h3 data-i18n="inv.m.a.h"></h3>
        <ul class="clean muted">
          <li data-i18n="inv.m.a.1"></li><li data-i18n="inv.m.a.2"></li><li data-i18n="inv.m.a.3"></li>
          <li data-i18n="inv.m.a.4"></li><li data-i18n="inv.m.a.5"></li>
        </ul></div>
    </div>
  </section>

</main>
<script src="../assets/js/vendor/chart.umd.min.js" defer></script>
<script src="../assets/js/calc.js" defer></script>
<script src="../assets/js/i18n.js" defer></script>
<script src="../assets/js/charts.js" defer></script>
<script src="../assets/js/pages/inventory.js" defer></script>
</body>
</html>
